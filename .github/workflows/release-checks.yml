name: Release workflow checks

on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - '.github/scripts/release.py'
      - 'tests/test_release.py'
      - 'pyproject.toml'
      - 'poetry.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release*.yml'
      - '.github/scripts/release.py'
      - 'tests/test_release.py'
      - 'pyproject.toml'
      - 'poetry.lock'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test release validation and retry behavior without publishing
        run: |
          python -m pip install 'pytest>=8.2,<9'
          python -m pytest tests/test_release.py -q
      - name: Check release workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/release.yml .github/workflows/release-checks.yml

  packages:
    name: Build and install release packages without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Build and validate wheel and source archive
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check --strict dist/*
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/sdist-wheel" dist/*.tar.gz
      - name: Install wheel outside checkout and check CLI
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install --index-url https://pypi.org/simple/ dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/package-smoke/bin/bofhound" --help
